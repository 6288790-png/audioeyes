<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>音频之眼</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script type="module" crossorigin src="/assets/main-CO5oEBYR.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/preload-helper-zJ_50EbN.js">
    <link rel="stylesheet" crossorigin href="/assets/main-BLdKJCOY.css">
  </head>
  <body>
    <div class="container" id="container">
      <canvas id="fireworksCanvas"></canvas>
      <canvas id="global-mouse-flow" aria-hidden="true"></canvas>

      <!-- 可视化效果选择器 -->
      <div class="visualization-selector" id="visualizationSelector">
        <select id="visualizationSelect">
          <option value="">加载中...</option>
        </select>
      </div>

      <!-- 可视化效果设置面板 -->
      <div class="visualization-settings" id="visualizationSettings">
        <!-- 效果模式选择器将在这里动态生成 -->
      </div>

      <!-- 信息面板 -->
      <div id="info">
        <h2>音频之眼</h2>

        <!-- 添加音乐信息元素 -->
        <div class="music-info" id="musicInfo" style="display: none">
          <div class="music-title" id="musicTitle"></div>
          <div class="music-details" id="musicDetails"></div>
        </div>

        <!-- 移除了状态提示元素和折叠按钮 -->
      </div>

      <!-- 播放列表 -->
      <div id="playlist-container">
        <h3 id="playlist-title">
          <i class="fas fa-list"></i> 播放列表<button id="expandPlaylist" title="展开播放列表">
            <i class="fas fa-expand"></i>
          </button>
        </h3>
        <div id="playlist-scroll-container">
          <ul id="playlist"></ul>
          <div id="playlist-empty">播放列表为空</div>
        </div>
        <!-- 保留播放列表基本控制，但移除可能的多余控制栏 -->
        <div class="playlist-controls">
          <button id="clearPlaylist"><i class="fas fa-trash"></i> 清空</button>
          <button id="shufflePlaylist"><i class="fas fa-random"></i> 随机</button>
        </div>
        <button class="collapse-toggle" data-target="playlist-container" title="折叠/展开">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

      <!-- 效果模式选择器 -->
      <div id="effect-modes-container">
        <h3><i class="fas fa-palette"></i> 效果模式</h3>
        <select id="effect-mode-selector"></select>
        <div id="effect-modes-empty">暂无可用效果模式</div>
        <button class="collapse-toggle" data-target="effect-modes-container" title="折叠/展开">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>

      <!-- ===== 底部 Dock Bar（功能栏） ===== -->
      <div id="controls">
        <!-- 隐藏的文件选择器 -->
        <input type="file" id="folderInput" multiple style="display: none" />

        <div class="dock-bar">
          <div class="dock-controls-row">
            <!-- 左侧：音频源 -->
            <div class="dock-section dock-left">
              <button id="loopbackButton" class="dock-btn" title="系统音频">
                <i class="fas fa-microphone"></i>
              </button>
              <label for="folderInput" class="dock-btn dock-label" title="选择音频文件">
                <i class="fas fa-folder-open"></i>
              </label>
            </div>

            <div class="dock-divider"></div>

            <!-- 中间：播放控制 -->
            <div class="dock-section dock-center">
              <button id="prevButton" class="dock-btn" title="上一首">
                <i class="fas fa-step-backward"></i>
              </button>
              <button id="playButton" class="dock-btn dock-play-btn" title="播放">
                <i class="fas fa-play"></i>
              </button>
              <button id="nextButton" class="dock-btn" title="下一首">
                <i class="fas fa-step-forward"></i>
              </button>
            </div>

            <div class="dock-divider"></div>

            <!-- 右侧：系统操作 -->
            <div class="dock-section dock-right">
              <button
                id="controlCenterBtn"
                class="dock-btn"
                title="控制中心"
                aria-label="控制中心"
                aria-expanded="false"
                aria-controls="controlCenterPanel"
              >
                <i class="fas fa-sliders"></i>
              </button>
              <button id="fullscreenButton" class="dock-btn" title="全屏">
                <i class="fas fa-expand"></i>
              </button>
            </div>
          </div>

          <!-- 播放进度条 -->
          <div class="dock-progress-bar">
            <span class="dock-progress-time" id="currentTime">00:00</span>
            <div class="dock-progress-track" id="progressTrack">
              <div class="dock-progress-fill" id="progressFill"></div>
              <div class="dock-progress-thumb" id="progressThumb"></div>
            </div>
            <span class="dock-progress-time" id="totalTime">00:00</span>
          </div>
        </div>

        <!-- 折叠按钮兼容（保留 DOM 但不显示） -->
        <button
          class="collapse-toggle"
          data-target="controls"
          title="折叠/展开"
          style="display: none"
        >
          <i class="fas fa-chevron-left"></i>
        </button>
      </div>

      <!-- 统一控制中心：原有设置内容会在初始化后挂载到右侧内容区 -->
      <section id="controlCenterPanel" class="control-center-panel" aria-label="控制中心" hidden>
        <header class="control-center-panel-header">
          <div class="control-center-heading">
            <strong>控制中心</strong>
            <span id="controlCenterCurrentTitle">歌词</span>
          </div>
          <div class="control-center-header-actions">
            <button
              id="helpBtn"
              class="control-center-help"
              type="button"
              title="帮助"
              aria-label="帮助"
            >
              <i class="fas fa-question-circle"></i>
            </button>
            <button
              id="controlCenterClose"
              class="control-center-close"
              type="button"
              aria-label="关闭控制中心"
            >
              &times;
            </button>
          </div>
        </header>
        <div class="control-center-layout">
          <nav class="control-center-tabs" role="tablist" aria-label="设置类别">
            <button
              id="lyricsFuncBtn"
              class="control-center-tab active"
              type="button"
              role="tab"
              data-control-page="lyrics"
              aria-selected="true"
            >
              <i class="fas fa-music"></i><span>歌词</span>
            </button>
            <button
              id="bgSettingsBtn"
              class="control-center-tab"
              type="button"
              role="tab"
              data-control-page="background"
              aria-selected="false"
            >
              <i class="fas fa-image"></i><span>背景</span>
            </button>
            <button
              id="switchSettingsBtn"
              class="control-center-tab"
              type="button"
              role="tab"
              data-control-page="switch"
              aria-selected="false"
            >
              <i class="fas fa-shuffle"></i><span>切换</span>
            </button>
            <button
              id="spectrumSettingsBtn"
              class="control-center-tab"
              type="button"
              role="tab"
              data-control-page="spectrum"
              aria-selected="false"
            >
              <i class="fas fa-chart-simple"></i><span>Dock</span>
            </button>
            <button
              id="globalMouseFlowToggle"
              class="control-center-tab"
              type="button"
              role="tab"
              data-control-page="flow"
              aria-selected="false"
            >
              <i class="fas fa-wand-magic-sparkles"></i><span>流体</span
              ><span class="control-center-status" aria-hidden="true"></span>
            </button>
          </nav>
          <div id="controlCenterContent" class="control-center-content"></div>
        </div>
      </section>

      <div
        id="globalMouseFlowPanel"
        class="settings-panel bg-settings-panel global-mouse-flow-panel"
        hidden
      >
        <div class="panel-header">
          <strong>鼠标流体</strong><button id="globalMouseFlowPanelClose" type="button">×</button>
        </div>
        <label
          >渲染后端<select id="globalMouseFlowBackend">
            <option value="webgl">WebGL</option>
            <option value="webgpu">WebGPU</option>
          </select></label
        >
        <label
          >效果<select id="globalMouseFlowEffect">
            <option value="rainbow">彩虹墨水</option>
            <option value="rainbowStep">七彩切换</option>
            <option value="oil">油彩</option>
            <option value="smoke">烟雾</option>
            <option value="water">彩色水波</option>
            <option value="artInk">霓彩墨迹</option>
            <option value="transparent">透明染液</option>
            <option value="volumeCursor">立体流体</option>
            <option value="trail">流光拖尾</option>
            <option value="velocity">速度方向场</option>
            <option value="colorful">幻彩流体</option>
            <option value="rainbowFish">彩虹流线</option>
            <option value="glaze">暖色流光</option>
            <option value="burn">火焰拖尾</option>
            <option value="liquidLens">液体透镜</option>
            <option value="densityTint">密度染色</option>
            <option value="simple">流向扭曲</option>
            <option value="chromatic">棱镜色差</option>
            <option value="waterDistortion">水面折射</option>
            <option value="caustics">动态焦散</option>
            <option value="rgb">RGB 分离</option>
          </select></label
        >
        <label
          >强度<input
            id="globalMouseFlowIntensity"
            type="range"
            min="0"
            max="3"
            step="0.01"
            value="1"
        /></label>
        <label
          >推动力<input
            id="globalMouseFlowForce"
            type="range"
            min="1"
            max="20"
            step="0.1"
            value="7"
        /></label>
        <label
          >流体范围<input
            id="globalMouseFlowRadius"
            type="range"
            min="0.2"
            max="3"
            step="0.01"
            value="1"
        /></label>
        <label
          >旋涡<input
            id="globalMouseFlowCurl"
            type="range"
            min="0"
            max="1.5"
            step="0.01"
            value="0.18"
        /></label>
        <label
          >速度消散<input
            id="globalMouseFlowVelocityDissipation"
            type="range"
            min="0.9"
            max="1"
            step="0.001"
            value="0.99"
        /></label>
        <label
          >密度消散<input
            id="globalMouseFlowDensityDissipation"
            type="range"
            min="0.85"
            max="1"
            step="0.001"
            value="0.94"
        /></label>
        <div class="setting-item">
          <label>基础流体参数</label
          ><button id="globalMouseFlowResetSimulation" type="button">恢复默认</button>
        </div>
      </div>
      <div id="loading">加载中...</div>

      <!-- 使用帮助弹窗（内容按需从 help-content.html 加载） -->
      <div id="helpModal" class="help-modal">
        <div class="help-modal-content">
          <div class="help-modal-header">
            <h2><i class="fas fa-question-circle"></i> 使用帮助</h2>
            <button class="help-modal-close" id="helpModalClose">&times;</button>
          </div>
          <div class="help-modal-body" id="helpModalBody">
            <p style="text-align: center; color: rgba(255, 255, 255, 0.5)">加载中...</p>
          </div>
        </div>
      </div>
    </div>


    <!-- Dock 设置面板 -->
    <div
      id="spectrumSettingsPanel"
      class="settings-panel spectrum-settings-panel"
      style="display: none"
    >
      <div class="panel-header">
        <h3><i class="fas fa-chart-bar"></i> Dock</h3>
        <button class="panel-close-btn" id="spectrumPanelCloseBtn">&times;</button>
      </div>
      <div class="panel-body">
        <!-- 模式切换：频谱 / 七彩 / 流光 / 泡泡流（四选一互斥） -->
        <div class="mode-switch-group">
          <div class="settings-row">
            <span class="settings-label">频谱效果</span>
            <label class="toggle-switch">
              <input type="checkbox" id="spectrumEnabledToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">七彩边框</span>
            <label class="toggle-switch">
              <input type="checkbox" id="rainbowBorderToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">旋转流动</span>
            <label class="toggle-switch">
              <input type="checkbox" id="flowingBorderToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="settings-row">
            <span class="settings-label">泡泡流</span>
            <label class="toggle-switch">
              <input type="checkbox" id="bubbleStreamToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="settings-divider"></div>
        <!-- 颜色主题 -->
        <div class="settings-group spectrum-only-control">
          <label class="settings-label">颜色主题</label>
          <div class="theme-grid" id="spectrumThemeGrid"></div>
        </div>
        <!-- 开关控制 -->
        <div class="settings-row spectrum-only-control">
          <span class="settings-label">粒子效果</span>
          <label class="toggle-switch">
            <input type="checkbox" id="spectrumParticlesToggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="settings-row spectrum-only-control">
          <span class="settings-label">环境光晕</span>
          <label class="toggle-switch">
            <input type="checkbox" id="spectrumGlowToggle" checked />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <!-- 柱密度 -->
        <div class="settings-group spectrum-only-control">
          <label class="settings-label">柱密度</label>
          <div class="btn-group" id="spectrumDensityGroup">
            <button class="btn-group-item" data-density="0">密</button>
            <button class="btn-group-item active" data-density="1">中</button>
            <button class="btn-group-item" data-density="2">疏</button>
          </div>
        </div>
        <!-- 动态材质（独立基底层，与上方三模式不互斥） -->
        <div class="settings-row">
          <span class="settings-label">动态材质</span>
          <label class="toggle-switch">
            <input type="checkbox" id="dockMaterialToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>
  </body>
</html>
